[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "colabdevkit"
version = "0.1.0"
description = "Development tools for Google Colab projects."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

authors = [
    {name = "Otavio Riani de Oliveira"}
]

dependencies = []

[tool.setuptools.packages.find]
include = ["colabdevkit*"]
